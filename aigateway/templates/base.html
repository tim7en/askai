<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AIGateway UZ{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-body-font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: #f8f9fa; }
    .sidebar { width: 240px; min-height: 100vh; background: #fff; border-right: 1px solid #e9ecef; }
    .sidebar .nav-link { color: #495057; padding: .625rem 1rem; font-size: .875rem; border-radius: .375rem; margin: 2px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #f0f0f0; color: #212529; }
    .main-content { flex: 1; padding: 2rem; max-width: 1200px; }
    .card { border: 1px solid #e9ecef; box-shadow: none; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #6c757d; }
    .badge-byo { background: #e3f2fd; color: #1565c0; }
    .badge-managed { background: #f3e5f5; color: #7b1fa2; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
