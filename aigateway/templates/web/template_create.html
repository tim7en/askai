{% extends "includes/app_layout.html" %}
{% block title %}New Template – AIGateway UZ{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="{% url 'web:templates' %}" class="small text-muted text-decoration-none">← Back to templates</a>
  <h1 class="h4 mt-2">Create Template</h1>
</div>

<div class="card p-4" style="max-width: 600px;">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label small fw-medium">Name</label>
      <input type="text" name="name" class="form-control" required placeholder="e.g. Code Review">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-medium">Task Type</label>
      <select name="task_type" class="form-select form-select-sm">
        <option value="chat">Chat</option>
        <option value="summarize">Summarize</option>
        <option value="translate">Translate</option>
        <option value="code">Code</option>
        <option value="extract">Extract</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-medium">System Prompt</label>
      <textarea name="system_text" class="form-control" rows="3" placeholder="Instructions for the AI..."></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-medium">User Prompt Template</label>
      <textarea name="user_text" class="form-control" rows="3" placeholder="Default user message..."></textarea>
    </div>
    <button type="submit" class="btn btn-dark">Save Template</button>
  </form>
</div>
{% endblock %}
